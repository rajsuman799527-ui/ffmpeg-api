name: reel
# The run name contains the job id so the app can find this run.
run-name: "reel ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id from the app"
        required: true
        type: string
      plan_url:
        description: "Link to the edit plan (JSON)"
        required: true
        type: string
      video_url:
        description: "Link to the raw speaker video (video mode)"
        required: false
        default: ""
        type: string
      audio_url:
        description: "Link to the voiceover audio (voice mode)"
        required: false
        default: ""
        type: string
      stills:
        description: "Preview only: comma separated seconds to render as PNG frames"
        required: false
        default: ""
        type: string
      cutout_url:
        description: "Optional link to the speaker cutout"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check inputs
        env:
          JOB_ID: ${{ inputs.job_id }}
          PLAN_URL: ${{ inputs.plan_url }}
          VIDEO_URL: ${{ inputs.video_url }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad job id"; exit 1; }
          [[ "$PLAN_URL" =~ ^https:// ]] || { echo "bad plan link"; exit 1; }
          [ -z "$VIDEO_URL" ] || [[ "$VIDEO_URL" =~ ^https:// ]] || { echo "bad video link"; exit 1; }
          [ -z "$AUDIO_URL" ] || [[ "$AUDIO_URL" =~ ^https:// ]] || { echo "bad audio link"; exit 1; }
          [ -n "$VIDEO_URL$AUDIO_URL" ] || { echo "need a video or an audio link"; exit 1; }

      - name: Install system libraries for the browser and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2

      - name: Install render tools
        working-directory: reel
        run: npm install --no-audit --no-fund

      - name: Render the reel
        working-directory: reel
        env:
          PLAN_URL: ${{ inputs.plan_url }}
          VIDEO_URL: ${{ inputs.video_url }}
          AUDIO_URL: ${{ inputs.audio_url }}
          CUTOUT_URL: ${{ inputs.cutout_url }}
          STILLS: ${{ inputs.stills }}
        run: |
          set -euo pipefail
          node render.mjs
          if [ -z "$STILLS" ]; then ls -la ../out.mp4; fi

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.stills }}" ]; then FILES=(stills/*.png); else FILES=(out.mp4); fi
          gh release create "job-$JOB_ID" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "job-$JOB_ID" --notes "Rendered by Reel Studio. Safe to delete after saving."
