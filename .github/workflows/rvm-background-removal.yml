name: RVM Video Background Removal
# The run name carries the job id so the app can find this run.
run-name: "rvm ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id from the app"
        required: true
        type: string
      video_url:
        description: "Public HTTPS URL of the input video"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-background:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check inputs
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad job id"; exit 1; }
          [[ "$VIDEO_URL" =~ ^https:// ]] || { echo "Only HTTPS video URLs are allowed"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          python -m pip install --upgrade pip

      - name: Download input video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          curl --fail --location --silent --show-error \
            --max-filesize 100000000 \
            "$VIDEO_URL" -o source.mp4
          test -s source.mp4
          # Work at most 720 pixels wide: same look, much faster on CPU.
          ffmpeg -y -v error -i source.mp4 -vf "scale='min(720,iw)':-2" -c:v libx264 -preset veryfast -crf 18 -an input.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4

      - name: Get RVM model
        run: |
          git clone --depth 1 https://github.com/PeterL1n/RobustVideoMatting.git rvm
          curl -L --fail https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3.pth -o rvm/rvm_mobilenetv3.pth

      - name: Install Python dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install av==9.2.0 pims opencv-python-headless numpy pillow tqdm

      - name: Split the video into frames
        run: |
          mkdir -p frames
          ffmpeg -y -v error -i input.mp4 -vsync 0 -q:v 2 frames/%05d.jpg
          ls frames | wc -l

      - name: Run RVM on CPU
        run: |
          cd rvm
          python inference.py \\
            --variant mobilenetv3 \\
            --checkpoint rvm_mobilenetv3.pth \\
            --device cpu \\
            --input-source ../frames \\
            --output-type png_sequence \\
            --output-alpha ../alpha \\
            --output-foreground ../fg
          ls ../alpha | wc -l

      - name: Create transparent WebM
        run: |
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 input.mp4)
          ffmpeg -y -v error -framerate "$FPS" -i fg/%04d.png -framerate "$FPS" -i alpha/%04d.png \\
            -filter_complex "[0:v][1:v]alphamerge,format=yuva420p[out]" \\
            -map "[out]" -an -c:v libvpx-vp9 -pix_fmt yuva420p -b:v 0 -crf 32 -row-mt 1 \\
            transparent.webm
          ls -la transparent.webm

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          gh release create "cut-$JOB_ID" transparent.webm --repo "$GITHUB_REPOSITORY" \
            --title "cut-$JOB_ID" --notes "Background removed by Reel Studio. Safe to delete after saving."
